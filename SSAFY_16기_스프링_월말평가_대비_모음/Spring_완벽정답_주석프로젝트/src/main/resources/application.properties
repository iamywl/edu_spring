# ============================================================================
# [0단계] application.properties : DB 연결 및 MyBatis 핵심 설정 파일
# 위치: src/main/resources/application.properties
# ============================================================================

# 1. MySQL 드라이버 클래스 (고정값 - 건드리지 말 것)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. 접속할 DB 주소 (★ 시험 문제 DB 이름이 바뀌면 ssafy_sample 부분만 바꾸기!)
# 예: jdbc:mysql://localhost:3306/시험DB이름?serverTimezone=UTC
spring.datasource.url=jdbc:mysql://localhost:3306/ssafy_sample?serverTimezone=UTC

# 3. 본인 PC MySQL 아이디 / 비밀번호 (★ 본인 PC 설정에 맞게 확인: 보통 ssafy/ssafy 또는 root/...)
spring.datasource.username=ssafy
spring.datasource.password=ssafy

# 4. 커넥션 풀(HikariCP) 기본 설정 (기존 파일에 있는 그대로 두기)
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=600000
spring.datasource.hikari.data-source-properties.profileSQL=true

# 5. MyBatis XML 파일 위치 지정
# classpath:/mappers/**/*.xml -> src/main/resources/mappers/ 폴더 아래 모든 .xml 파일을 읽음
mybatis.mapper-locations=classpath:/mappers/**/*.xml

# 6. DB 컬럼 값이 NULL일 때도 자바 DTO의 setter를 호출함
mybatis.configuration.call-setters-on-nulls=true

# 7. XML에서 DTO 이름을 짧게 쓰기 위한 패키지 경로 설정
# ★ 만약 시험 패키지가 com.ssafy.exam.model.dto 라면 com.ssafy.exam.*.dto 로 맞추기!
# (참고: *.dto 는 중간 폴더가 1개일 때, **.dto 는 여러 단계일 때 사용)
mybatis.type-aliases-package=com.ssafy.sample.*.dto

# ★★★ [필수 추가 1줄!!] 시험 시작하자마자 무조건 맨 아래에 추가하세요! ★★★
# DB의 밑줄 이름(product_id, last_customer_name)을
# 자바의 카멜케이스 변수(productId, lastCustomerName)로 자동 연결해 줍니다.
# (이게 없으면 resultType="...SearchResponse" 등에서 필드가 null 또는 0으로 나옵니다!)
mybatis.configuration.map-underscore-to-camel-case=true

# (선택) 콘솔창에 실제 실행되는 SQL과 파라미터를 보고 싶으면 아래 주석(#) 해제
# logging.level.com.ssafy.sample.model.dao=DEBUG
